<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Structural Repair Log - Select Project</title>
    <script>
        // Función para seleccionar proyecto existente
        window.selectProject = (msn) => {
            document.querySelectorAll('.project-list-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.querySelector(`[data-msn="${msn}"]`).classList.add('selected');
            document.getElementById('finalize-msn').value = msn;
            document.getElementById('finalize-selection-error').style.display = 'none';
        };

        // Función para continuar (Open Project)
        window.finalizeSelection = () => {
            const msn = document.getElementById('finalize-msn').value;
            if (!msn) {
                document.getElementById('finalize-selection-error').style.display = 'block';
                return;
            }
            // Navegar al menú de Rol con el MSN seleccionado
            window.location.href = `/role_select/${msn}`;
        };
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #e9ebee; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-content { max-width: 800px; width: 90%; background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; margin-bottom: 30px; color: #004c99; font-size: 1.8em; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* Project List */
        .project-list-container { 
            max-height: 350px; 
            overflow-y: auto; 
            border: 1px solid #ced4da; 
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .project-list-item { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
            transition: background-color 0.1s;
            display: flex;
            justify-content: space-between;
        }
        .project-list-item:last-child { border-bottom: none; }
        .project-list-item:hover { background-color: #e9ecef; }
        .project-list-item.selected { 
            background-color: #d1ecf1; 
            font-weight: 600;
            color: #004c99;
        }

        /* Button Styles */
        .btn-blue { 
            width: 100%;
            padding: 12px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1em;
            margin-top: 25px;
        }
        .btn-back { background-color: #6c757d; margin-top: 10px; }
        .error-message { color: #dc3545; margin-top: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>2. Select Existing Project</h1>
        
        <div class="project-list-container">
            <div id="project-list-items">
                {% for msn, data in projects.items() %}
                    <div class="project-list-item" data-msn="{{ msn }}" onclick="selectProject('{{ msn }}')">
                        <span>{{ msn }}</span>
                        <span>Reg: {{ data.Aircraft_Reg }}</span>
                    </div>
                {% endfor %}
            </div>
        </div>
        
        <input type="hidden" id="finalize-msn" value="">
        <button onclick="finalizeSelection()" class="btn-blue">Continue to Role Selection</button>
        <button onclick="window.location.href='/'" class="btn-blue btn-back">Go Back</button>
        <p class="error-message" id="finalize-selection-error" style="display:none;">**ERROR: Please select a project.**</p>
    </div>
</body>
</html>
