<!DOCTYPE html>
<html><head><title>Physical Audit - {{ msn }}</title>
<style>
    body { font-family: Arial; margin: 0; background: #f4f6f9; position: relative; }
    .header { background: #1e40af; color: white; padding: 20px; text-align: center; }
    .container { padding: 20px; max-width: 1000px; margin: auto; }
    .audit-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .audit-card.non-conforming { border-left: 5px solid #d32f2f; }
    .photo { max-width: 300px; border-radius: 5px; }
</style></head><body>

<div style="position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 100;">
    <a href="/dashboard/{{ msn }}" style="background: #1976d2; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px;">Back to Dashboard</a>
    <a href="/logout/{{ msn }}" style="background: #d32f2f; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px;">Exit Role</a>
</div>

<div class="header"><h1>Physical Audit - {{ msn }}</h1><p>Role: {{ role|title }}</p></div>
<div class="container">
    {% for r in physical_items %}
    <div class="audit-card {{ 'non-conforming' if r.Audit_Physical_Status == 'Non-Conforming' else '' }}">
        <h3>{{ r.Repair_ID }} | {{ r.ATA_Chapter }}</h3>
        <p><strong>Status:</strong> {{ r.Audit_Physical_Status }}</p>
        {% if r.Doc_Photo_Post %}
        <img src="/api/documents/download/{{ msn }}/{{ r.Doc_Photo_Post }}" class="photo">
        {% endif %}
    </div>
    {% endfor %}
</div>
</body></html>
