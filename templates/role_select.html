<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Role</title>
    <style>
        body { font-family: Arial; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .role-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #1e40af; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="role-box">
        <h2>Select Your Role</h2>
        <form method="POST" action="/login">
            <input type="hidden" name="msn" value="{{ msn }}">
            <input type="password" name="password" placeholder="Password" required />
            <select name="role" required>
                <option value="">Select role</option>
                <option value="operator">Operator</option>
                <option value="auditor">Auditor</option>
                <option value="lessor">Lessor</option>
            </select>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
