<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Structural Repair Log</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 50px 60px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: #1e40af;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
        }
        h1 {
            color: #1e40af;
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }
        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .btn {
            display: block;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1976d2, #1565c0);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #388e3c, #2e7d32);
            color: white;
        }
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
        }

        @media (max-width: 480px) {
            .container { padding: 40px 30px; }
            h1 { font-size: 1.8rem; }
            .btn { padding: 14px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SR</div>
        <h1>Aircraft Structural Repair Log</h1>
        <p>Manage structural repairs, discrepancies, and audit trails with full traceability.</p>

        <div class="btn-group">
            <a href="/project/create" class="btn btn-primary">Create New Project</a>
            <a href="/project/select" class="btn btn-secondary">Open Existing Project</a>
        </div>
    </div>
</body>
</html>

</body>

</html>
