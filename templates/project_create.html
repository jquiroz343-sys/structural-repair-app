<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Structural Repair Log - Create Project</title>
    <script>
        window.createProject = async () => {
            const form = document.getElementById('create-project-form');
            const formData = new FormData(form);
            const projectData = {};
            
            formData.forEach((value, key) => { projectData[key] = value.trim(); });
            
            if (!projectData.msn || !projectData.Aircraft_Reg || !projectData.Date_Initiated) {
                alert("MSN, Registration, and Date Initiated are mandatory.");
                return;
            }
            
            const msgElement = document.getElementById('create-response-message');
            msgElement.textContent = 'Creating project...';
            msgElement.style.color = 'gray';
            
            try {
                const response = await fetch('/api/projects/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(projectData)
                });
                const result = await response.json();

                if (response.ok) {
                    msgElement.style.color = 'green';
                    msgElement.textContent = `Success! Project ${projectData.msn} created. Proceeding to Role Selection...`;
                    
                    setTimeout(() => {
                        window.location.href = `/role_select/${projectData.msn}`;
                    }, 1500);
                } else {
                    msgElement.style.color = 'red';
                    msgElement.textContent = result.message || 'An unknown error occurred.';
                }
            } catch (error) {
                msgElement.style.color = 'red';
                msgElement.textContent = 'Network error during project creation.';
            }
        };

        window.goBack = () => { window.location.href = '/'; };
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #e9ebee; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .panel { max-width: 600px; width: 90%; background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1); }
        h1 { color: #004c99; font-size: 1.8em; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 30px; text-align: center; }
        
        .form-group label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 4px; }
        .error-message { color: #dc3545; margin-top: 10px; font-weight: bold; }

        .btn-action { width: 48%; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1em; margin-top: 30px; border: none; }
        .btn-create { background-color: #28a745; color: white; margin-right: 4%; }
        .btn-back { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>1. Create New Aircraft Project</h1>
        <form id="create-project-form" onsubmit="event.preventDefault(); createProject()">
            <div class="form-group"><label for="new_msn">Aircraft MSN (Mandatory):</label><input type="text" id="new_msn" name="msn" required></div>
            <div class="form-group"><label for="Aircraft_Reg">Aircraft Registration (Mandatory):</label><input type="text" id="Aircraft_Reg" name="Aircraft_Reg" required></div>
            <div class="form-group"><label for="Date_Initiated">Date Initiated (Mandatory):</label><input type="text" id="Date_Initiated" name="Date_Initiated" placeholder="YYYY-MM-DD" required></div>
            <div class="form-group"><label for="FH_Initiated">FH Initiated:</label><input type="text" id="FH_Initiated" name="FH_Initiated"></div>
            <div class="form-group"><label for="FC_Initiated">FC Initiated:</label><input type="text" id="FC_Initiated" name="FC_Initiated"></div>
            <div class="form-group"><label for="Lease_Agreement_Ref">Lease Agreement Ref:</label><input type="text" id="Lease_Agreement_Ref" name="Lease_Agreement_Ref"></div>
            
            <button type="submit" class="btn-action btn-create">Create Project and Select Role</button>
            <button type="button" onclick="goBack()" class="btn-action btn-back">Go Back</button>
            
            <p class="error-message" id="create-response-message"></p>
        </form>
    </div>
</body>
</html>
