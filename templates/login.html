<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - SRF App</title>
  <style>
    body { font-family: Arial; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
    input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #1e40af; color: white; font-weight: bold; cursor: pointer; }
    .error { color: red; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Structural Repair Log</h2>
    <form method="POST">
      <input type="password" name="password" placeholder="Contraseña" required />
      <select name="role" required>
        <option value="">Selecciona tu rol</option>
        <option value="operator">Operador</option>
        <option value="auditor">Auditor</option>
        <option value="lessor">Lessor</option>
      </select>
      <button type="submit">Ingresar</button>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p class="error">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
