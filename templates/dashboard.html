<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - {{ msn }}</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; position: relative; }
        .header { background: #1e40af; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; text-align: center; }
        .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
        .menu-btn { padding: 18px; text-align: center; color: white; font-weight: bold; border-radius: 12px; text-decoration: none; }
        .btn-oil { background: #d32f2f; }
        .btn-physical { background: #f57c00; }
        .btn-signed { background: #388e3c; }
    </style>
</head>
<body>
    <div style="position: absolute; top: 15px; right: 15px;">
        <a href="/logout/{{ msn }}" style="background: #d32f2f; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold;">Exit Role</a>
    </div>

    <div class="header"><h1>Structural Repair Log</h1><p>MSN: {{ msn }} | Role: {{ role|title }}</p></div>
    <div class="container">
        <div class="stats">
            <div class="stat-card"><h3>Total Repairs</h3><p>{{ repairs|length }}</p></div>
            <div class="stat-card"><h3>OIL Open</h3><p>{{ oil_open }}</p></div>
            <div class="stat-card"><h3>OIL Closed</h3><p>{{ oil_closed }}</p></div>
            <div class="stat-card"><h3>Non-Conforming</h3><p>{{ non_conforming }}</p></div>
        </div>

        <div class="menu">
            <a href="/oil/{{ msn }}" class="menu-btn btn-oil">Open Items List (OIL)</a>
            <a href="/physical_audit/{{ msn }}" class="menu-btn btn-physical">Physical Audit</a>
            <a href="/signed_oil_report/{{ msn }}" class="menu-btn btn-signed">Signed OIL Report</a>
        </div>
    </div>
</body>
</html>
